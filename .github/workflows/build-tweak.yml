name: Build Custom Tweak

on:
  push:
    paths:
      - 'CustomTweak.xm'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Compile with clang
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"

          # 直接编译xm为mm（Logos简单语法我们自己处理）
          # 先用perl logos预处理（如果有logos）
          # 简单方式：直接当objc++编译
          cp CustomTweak.xm CustomTweak.mm

          clang -arch arm64 -arch arm64e \
            -isysroot "$SDK" \
            -dynamiclib \
            -O2 \
            -fobjc-arc \
            -install_name "CustomTweak.dylib" \
            -o CustomTweak.dylib \
            CustomTweak.mm \
            -framework Foundation \
            -framework UIKit \
            -framework CoreFoundation

          ls -lh CustomTweak.dylib

      - name: Codesign
        run: |
          codesign --sign - --force --deep CustomTweak.dylib

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: CustomTweak-dylib
          path: CustomTweak.dylib