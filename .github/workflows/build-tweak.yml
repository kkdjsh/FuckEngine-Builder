name: Build Custom Tweak

on:
  push:
    paths:
      - 'CustomTweak.xm'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git /opt/theos
          echo "THEOS=/opt/theos" >> $GITHUB_ENV

      - name: Create project
        run: |
          mkdir -p Project
          cp CustomTweak.xm Project/Tweak.xm
          cat > Project/Makefile << 'MAKEEOF'
TARGET = iphone:clang:14.5:14.0
ARCHS = arm64 arm64e
include $(THEOS)/makefiles/common.mk
TWEAK_NAME = CustomTweak
$(TWEAK_NAME)_FILES = Tweak.xm
$(TWEAK_NAME)_CFLAGS = -fobjc-arc
$(TWEAK_NAME)_FRAMEWORKS = Foundation UIKit
include $(THEOS_MAKE_PATH)/tweak.mk
MAKEEOF

      - name: Compile
        run: |
          cd Project
          make THEOS=/opt/theos FINALPACKAGE=1

      - name: Codesign
        run: |
          codesign --sign - --force --deep Project/.theos/_/CustomTweak.dylib

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: CustomTweak-dylib
          path: Project/.theos/_/CustomTweak.dylib