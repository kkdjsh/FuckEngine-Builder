name: Build GOATHook dylib

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Compile GOATHook.dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"

          clang -arch arm64 -arch arm64e \
            -isysroot "$SDK" \
            -dynamiclib \
            -O2 \
            -fobjc-arc \
            -install_name "GOATHook.dylib" \
            -o GOATHook.template.dylib \
            GOATHook.m \
            -framework Foundation \
            -framework UIKit \
            -framework CoreFoundation

          echo "=== Build info ==="
          ls -lh GOATHook.template.dylib
          echo "=== Sections ==="
          otool -l GOATHook.template.dylib | grep -A 4 "goat" | head -30

      - name: Ad-hoc codesign dylib
        run: |
          # 非越狱环境必须签名，否则 dyld 拒绝加载
          codesign --sign - --force --deep GOATHook.template.dylib
          echo "=== Signature ==="
          codesign -dv GOATHook.template.dylib 2>&1
          ls -lh GOATHook.template.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: GOATHook-template-dylib
          path: GOATHook.template.dylib
